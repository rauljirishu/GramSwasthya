<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0f172a">
    <title>GramCare is offline</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f1f5f9; color: #0f172a; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(100%, 460px); padding: 32px; border: 1px solid #dbeafe; border-radius: 24px; background: white; box-shadow: 0 18px 45px #0f172a14; }
      .mark { display: grid; width: 48px; height: 48px; place-items: center; border-radius: 14px; background: #2563eb; color: white; font-size: 28px; font-weight: 800; }
      h1 { margin: 20px 0 8px; font-size: 26px; }
      p { color: #475569; }
      button { margin-top: 10px; padding: 11px 16px; border: 0; border-radius: 10px; background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">+</div>
      <h1>You’re offline</h1>
      <p>This GramCare page could not load. Reconnect to the internet and reload this page. We won’t replace it with a different dashboard.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
